name: Train and Save model

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  
jobs:
  train_and_save_modeL:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        python: ["3.10", "3.11", "3.12"]

    permissions:
      id-token: write
      contents: read

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: configure-aws-credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      
      - name: upgrade-pip
        run: python -m pip install --upgrade pip setuptools wheel
         
      - name: install-deps
        run: python -m pip install -r requirements.txt

      - name: cache-dataset
        id: cache-dataset
        uses: actions/cache@v4
        with:
          path: data/ai4i2020.csv
          key: dvc-data-${{ hashFiles('data/ai4i2020.csv.dvc') }}

      - name: Pull dataset from DVC remote
        if: steps.cache-dataset.outputs.cache-hit != 'true'
        run: dvc pull
      
      - name: Train the model
        run: |
          python train.py
          ls -la artifacts
      
      - name: upload-to-artifacts
        uses: actions/upload-artifact@v7
        with:
          path: artifacts
          name: ml-artifacts-${{ matrix.python }}-${{ github.run_id }}

  build_and_push_image:
    needs: train_and_save_modeL
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: log-in-to-ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: image-metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

